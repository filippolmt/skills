name: regenerate

# The skills tree is generated from the catalog, and the catalog moves on its own:
# Renovate opens a PR per upstream `sha`. Regenerating INSIDE those PRs would bury
# their one real line — the `sha` — under a tree diff, and those PRs are the
# mechanism the whole catalog's freshness rests on (ADR-0010). So regeneration
# runs after the merge instead, and proposes its own PR — then merges it unattended
# once `validate` passes (ADR-0011).
#
# Caveat worth knowing: a PR opened with GITHUB_TOKEN does not trigger `validate`.
# That is why this job runs the full validation suite itself before opening one, and
# then dispatches `validate` against the branch, so the one required check actually
# arrives instead of leaving the PR's checks tab empty and auto-merge waiting.

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/marketplace.json
      - scripts/gen-skills-tree.js
      - overlays/**
      # A hand-edit of the tree belongs here too: regeneration is what undoes it.
      - skills/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-skills-tree
  cancel-in-progress: true

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate skills/
        run: node scripts/gen-skills-tree.js
      - name: Stop here when the tree is already current
        id: diff
        run: |
          if [ -z "$(git status --porcelain skills)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tree already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short skills
          fi
        shell: bash
      - name: Validate before proposing
        if: steps.diff.outputs.changed == 'true'
        run: |
          shopt -s nullglob
          for t in scripts/*.test.js plugins/*/hooks/*.test.js; do echo "--- $t"; node "$t"; done
          node scripts/gen-readme.js --check
          node scripts/check-renovate.js
          node scripts/check-name-collisions.js
          node scripts/gen-skills-tree.js --check
        shell: bash
      - name: Open or update the regeneration PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=chore/regenerate-skills-tree
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add skills
          git commit -m 'chore: regenerate skills tree'
          git push --force origin "$branch"
          # A single long-lived branch: a second regeneration force-pushes onto the
          # open PR rather than stacking a new one nobody closes.
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base main --head "$branch" \
              --title 'chore: regenerate skills tree' \
              --body 'Generated by `.github/workflows/regenerate.yml` from the catalog, and merged unattended once `validate` passes (ADR-0011). The tree is an artifact: the only question is whether it matches the catalog, which `node scripts/gen-skills-tree.js --check` answers — in the job above, before the push.')"
          fi
          # Raise the required check on the branch, then let the platform merge when it
          # goes green. Both lines are idempotent: on an existing PR the dispatch is a
          # re-run against the new head, and auto-merge is already armed.
          gh workflow run validate.yml --ref "$branch"
          gh pr merge --auto --squash "$pr"
        shell: bash

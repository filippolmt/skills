name: regenerate

# The skills tree is generated from the catalog, and the catalog moves on its own:
# Renovate opens a PR per upstream `sha`. Regenerating INSIDE those PRs would bury
# their one real line — the `sha` — under a tree diff, and those PRs are the
# mechanism the whole catalog's freshness rests on (ADR-0010). So regeneration
# runs after the merge instead, and proposes its own PR — then merges it unattended
# once `validate` passes (ADR-0011).
#
# Caveat worth knowing: a branch pushed with GITHUB_TOKEN gets its `pull_request`
# run of `validate` — the one check `main` requires — created but **parked**, as a
# run awaiting approval (`conclusion: action_required`). Nothing else blocks the
# merge; that parked run does. So this job approves it, waits for it, and merges on
# green. Waiting is what keeps a bad tree loud: a red `validate` fails THIS run,
# where a failure is visible, instead of parking a PR nobody is told about.
#
# It also validates before pushing anything, which is not the same suite: that pass
# is `gen-skills-tree.js --check`, which runs nowhere else, and it fails the
# regeneration before a branch exists.

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/marketplace.json
      - scripts/gen-skills-tree.js
      - overlays/**
      # A hand-edit of the tree belongs here too: regeneration is what undoes it.
      - skills/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # An explicit block sets every scope it omits to `none`, and dispatching
  # `validate` (plus reading back the run it starts) is an Actions API write.
  # Without this the dispatch 403s and the whole flow stops at the push.
  actions: write

concurrency:
  group: regenerate-skills-tree
  cancel-in-progress: true

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate skills/
        run: node scripts/gen-skills-tree.js
      - name: Stop here when the tree is already current
        id: diff
        run: |
          if [ -z "$(git status --porcelain skills)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tree already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short skills
          fi
        shell: bash
      - name: Validate before proposing
        if: steps.diff.outputs.changed == 'true'
        run: |
          bash scripts/run-tests.sh
          node scripts/gen-readme.js --check
          node scripts/check-renovate.js
          node scripts/check-name-collisions.js
          node scripts/gen-skills-tree.js --check
        shell: bash
      - name: Open or update the regeneration PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=chore/regenerate-skills-tree
          # Both waits below have the same shape and the same bound, so they read as
          # one habit: try, pause, try again, and fail loudly rather than take the
          # first no as final. Never a bare sleep after the last attempt.
          attempts=6
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add skills
          git commit -m 'chore: regenerate skills tree'
          git push --force origin "$branch"
          sha="$(git rev-parse HEAD)"
          # A single long-lived branch: a second regeneration force-pushes onto the
          # open PR rather than stacking a new one nobody closes. Re-query rather
          # than read `gh pr create`, which prints a URL where the list prints a
          # number — one shape for `$pr`, whichever path got here. `.[0]` inside jq
          # rather than `| head -1`: a list is what comes back even when a branch can
          # only carry one PR, and `head` closing the pipe early would SIGPIPE `gh`
          # into a failure `pipefail` then treats as fatal.
          find_pr() {
            gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty'
          }
          pr="$(find_pr)"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title 'chore: regenerate skills tree' \
              --body 'Generated by `.github/workflows/regenerate.yml` from the catalog, and merged unattended once `validate` passes (ADR-0011). The tree is an artifact: the only question is whether it matches the catalog, which `node scripts/gen-skills-tree.js --check` answers — in the job above, before the push.' >/dev/null
            pr="$(find_pr)"
          fi
          # The push created the `pull_request` run of `validate` and left it parked
          # awaiting approval. Find it by head sha, not by "newest run": this branch
          # is long-lived, so the previous cycle's run sits right there to be mistaken
          # for this one, and a verdict from the wrong tree is worse than no verdict.
          run=""
          for attempt in $(seq "$attempts"); do
            run="$(gh run list --workflow validate.yml --event pull_request --limit 20 \
              --json databaseId,headSha --jq "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")"
            if [ -n "$run" ]; then break; fi
            if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
          done
          if [ -z "$run" ]; then
            echo "::error::no pull_request run of validate appeared for $sha" >&2
            exit 1
          fi
          run_conclusion() {
            gh run view "$run" --json conclusion --jq '.conclusion'
          }
          # Approve only when it is actually waiting: GitHub may not park it at all,
          # and approving a running one is an error rather than a no-op. Then wait for
          # the parked conclusion to clear — `gh run watch` on a run still marked
          # `action_required` returns that immediately and reads as the verdict.
          if [ "$(run_conclusion)" = "action_required" ]; then
            gh api -X POST "repos/$REPO/actions/runs/$run/approve" >/dev/null
            for attempt in $(seq "$attempts"); do
              if [ "$(run_conclusion)" != "action_required" ]; then break; fi
              if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
            done
          fi
          # Adopt its verdict: green merges, red fails this run. Waiting here rather
          # than arming auto-merge is the whole reason a failure is visible.
          gh run watch "$run" --exit-status
          # The check lands on the PR as any other `pull_request` check, so this is
          # insurance against re-evaluation lag, not the mechanism: one rejection is
          # not final, and if it never clears, say so.
          for attempt in $(seq "$attempts"); do
            if gh pr merge --squash "$pr"; then exit 0; fi
            echo "merge rejected on attempt $attempt, mergeStateStatus=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)"
            if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
          done
          echo "::error::validate passed on $sha but #$pr would not merge" >&2
          exit 1
        shell: bash

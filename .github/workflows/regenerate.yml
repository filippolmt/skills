name: regenerate

# The skills tree is generated from the catalog, and the catalog moves on its own:
# Renovate opens a PR per upstream `sha`. Regenerating INSIDE those PRs would bury
# their one real line — the `sha` — under a tree diff, and those PRs are the
# mechanism the whole catalog's freshness rests on (ADR-0010). So regeneration
# runs after the merge instead, and proposes its own PR — then merges it unattended
# once `validate` passes (ADR-0011).
#
# Caveat worth knowing: a branch pushed with GITHUB_TOKEN gets its `pull_request`
# run of `validate` — the one check `main` requires — created but **parked**,
# awaiting approval (`conclusion: action_required`), and no token available inside
# a workflow can approve it. So the push uses `REGEN_TOKEN` instead, the run starts
# by itself, and this job waits for it and merges on green. Waiting is what keeps a
# bad tree loud: a red `validate` fails THIS run, where a failure is visible,
# instead of parking a PR nobody is told about.
#
# It also validates before pushing anything, which is not the same suite: that pass
# is `gen-skills-tree.js --check`, which runs nowhere else, and it fails the
# regeneration before a branch exists.
#
# An entry whose folder upstream deleted or renamed is pruned here, not on the
# Renovate PR that moved its `sha` (ADR-0015): the generator drops it from the
# catalog and from every bundle's `dependencies`, regenerates the README, and this
# PR carries all of it — and names it in its body, since the merge is unattended
# like any other.

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/marketplace.json
      - scripts/gen-skills-tree.js
      - overlays/**
      # A hand-edit of the tree belongs here too: regeneration is what undoes it.
      - skills/**
  workflow_dispatch:

# `GITHUB_TOKEN` does none of the work below — `REGEN_TOKEN` does, so that the push
# comes from a real identity (ADR-0011). Read is all the default token needs, and an
# explicit block sets every scope it omits to `none`.
permissions:
  contents: read

concurrency:
  group: regenerate-skills-tree
  cancel-in-progress: true

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      # First, so a missing or expired secret is one clear line instead of a
      # confusing failure four steps later.
      - name: Require the regeneration token
        env:
          REGEN_TOKEN: ${{ secrets.REGEN_TOKEN }}
          GH_TOKEN: ${{ secrets.REGEN_TOKEN }}
        run: |
          if [ -z "$REGEN_TOKEN" ]; then
            echo "::error::secret REGEN_TOKEN is missing or expired — see docs/adr/0011-the-regeneration-pr-merges-itself.md for what it is and how to mint it" >&2
            exit 1
          fi
          # Present is not the same as usable, and the difference is expensive: a
          # token that authenticates and cannot write fails four steps later as a
          # bare `Permission to <repo> denied to <user>`, which names neither the
          # secret nor what it is missing. Ask the API the same question the push
          # asks. `x-oauth-scopes` comes back only for a classic PAT — absent means
          # fine-grained — so the line also says WHICH page to go fix.
          kind="$(gh api -i /user 2>/dev/null | grep -i '^x-oauth-scopes:' || echo 'x-oauth-scopes: absent (fine-grained token)')"
          push="$(gh api "repos/$GITHUB_REPOSITORY" --jq .permissions.push 2>/dev/null || echo 'no-access')"
          echo "REGEN_TOKEN: $kind | permissions.push=$push"
          if [ "$push" != true ]; then
            echo "::error::REGEN_TOKEN cannot write to $GITHUB_REPOSITORY (permissions.push=$push). A fine-grained PAT needs this repository under 'Only select repositories' with contents: write and pull-requests: write; a classic PAT needs the 'repo' scope. See docs/adr/0011-the-regeneration-pr-merges-itself.md" >&2
            exit 1
          fi
        shell: bash
      - uses: actions/checkout@v7
        with:
          # The push inherits these credentials, and that is the whole point: a
          # branch pushed with `GITHUB_TOKEN` gets its `validate` run parked
          # awaiting approval, which no token available here can give.
          token: ${{ secrets.REGEN_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate skills/, pruning what upstream removed
        run: node scripts/gen-skills-tree.js
      - name: Stop here when the tree is already current
        id: diff
        # The whole working tree, not only skills/: a prune also rewrites the
        # catalog, the bundles it touched and the README.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tree already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi
        shell: bash
      - name: Validate before proposing
        if: steps.diff.outputs.changed == 'true'
        run: |
          bash scripts/run-tests.sh
          node scripts/gen-readme.js --check
          node scripts/check-renovate.js
          node scripts/check-name-collisions.js
          node scripts/gen-skills-tree.js --check
        shell: bash
      - name: Open or update the regeneration PR
        if: steps.diff.outputs.changed == 'true'
        env:
          # The same token as the checkout, so the PR is opened by the identity that
          # pushed the branch and its `validate` run is nobody's to approve.
          GH_TOKEN: ${{ secrets.REGEN_TOKEN }}
        run: |
          set -euo pipefail
          branch=chore/regenerate-skills-tree
          # Both waits below have the same shape and the same bound, so they read as
          # one habit: try, pause, try again, and end in a labelled error rather than
          # take the first no as final. Never a bare sleep after the last attempt.
          attempts=6
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -A
          git commit -m 'chore: regenerate skills tree'
          git push --force origin "$branch"
          sha="$(git rev-parse HEAD)"
          # A single long-lived branch: a second regeneration force-pushes onto the
          # open PR rather than stacking a new one nobody closes. Re-query rather
          # than read `gh pr create`, which prints a URL where the list prints a
          # number — one shape for `$pr`, whichever path got here. `.[0]` inside jq
          # rather than `| head -1`: a list is what comes back even when a branch can
          # only carry one PR, and `head` closing the pipe early would SIGPIPE `gh`
          # into a failure `pipefail` then treats as fatal.
          find_pr() {
            gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty'
          }
          # What left, read off the commit rather than reported by the generator: the
          # catalog entries it pruned, and every skill the tree lost — which covers
          # a skill gone from inside a whole-plugin entry too, where nothing is
          # pruned but the entry's description may still name it.
          pruned="$(node -e '
            const names = (t) => new Set(JSON.parse(t).plugins.map((p) => p.name));
            const [before, after] = process.argv.slice(1).map(names);
            console.log([...before].filter((n) => !after.has(n)).join("\n"));
          ' "$(git show HEAD~1:.claude-plugin/marketplace.json)" "$(git show HEAD:.claude-plugin/marketplace.json)")"
          dropped="$(git diff --name-only --diff-filter=D HEAD~1 HEAD -- 'skills/*/SKILL.md' | cut -d/ -f2)"
          bullets() { while read -r name; do if [ -n "$name" ]; then echo "- \`$name\`"; fi; done <<< "$1"; }
          body="$(cat <<'EOF'
          Generated by `.github/workflows/regenerate.yml` from the catalog, and merged unattended once `validate` passes (ADR-0011). The tree is an artifact: the only question is whether it matches the catalog, which `node scripts/gen-skills-tree.js --check` answers — in the job above, before the push.
          EOF
          )"
          if [ -n "$pruned" ]; then
            body+=$'\n\n'"**Pruned from the catalog** — removed or renamed upstream (ADR-0015):"$'\n'"$(bullets "$pruned")"
            body+=$'\n\n'"Installed copies break: \`claude plugin update\` on these names fails with \`Plugin \"<name>\" not found\`. Uninstall each with \`/plugin uninstall <name>@filippo-skills\` in every scope that has it (README, *When a skill leaves the catalog*). A rename upstream is pruned the same way: re-add the new folder with \`/add-external-skill\`."
          fi
          if [ -n "$dropped" ]; then
            body+=$'\n\n'"**Skills leaving the tree:**"$'\n'"$(bullets "$dropped")"$'\n\n'"A bundle or entry description naming one of these is prose, and still needs a hand edit."
          fi
          pr="$(find_pr)"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title 'chore: regenerate skills tree' --body "$body" >/dev/null
            pr="$(find_pr)"
          else
            # A long-lived PR force-pushed onto: its body must describe THIS tree.
            gh pr edit "$pr" --body "$body" >/dev/null
          fi
          # The push started the `pull_request` run of `validate` by itself. Find it
          # by head sha, not by "newest run": this branch is long-lived, so the
          # previous cycle's run sits right there to be mistaken for this one, and a
          # verdict from the wrong tree is worse than no verdict. The runs API
          # reports `head_sha` as the PR head — the commit just pushed — even though
          # the run itself checks out `refs/pull/N/merge`; if that ever changed, this
          # would fail as "no run appeared" rather than match the wrong thing.
          run=""
          for attempt in $(seq "$attempts"); do
            run="$(gh run list --workflow validate.yml --event pull_request --limit 20 \
              --json databaseId,headSha --jq "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")"
            if [ -n "$run" ]; then break; fi
            if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
          done
          if [ -z "$run" ]; then
            echo "::error::no pull_request run of validate appeared for $sha" >&2
            exit 1
          fi
          # Adopt its verdict: green merges, red fails this run. Waiting here rather
          # than arming auto-merge is the whole reason a failure is visible.
          gh run watch "$run" --exit-status
          # The check lands on the PR as any other `pull_request` check, so this is
          # insurance against re-evaluation lag, not the mechanism: one rejection is
          # not final, and if it never clears, say so.
          # A flag rather than `exit 0` from inside the loop: this happens to be the
          # last step of the last job, and nothing here should depend on that.
          merged=false
          for attempt in $(seq "$attempts"); do
            if gh pr merge --squash "$pr"; then merged=true; break; fi
            # `|| echo unknown` because a substitution inside an argument is exempt
            # from `set -e`: a transient API error would otherwise print nothing and
            # read as a state, in the one line explaining why the merge was refused.
            state="$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus || echo unknown)"
            echo "merge rejected on attempt $attempt, mergeStateStatus=$state"
            if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
          done
          if [ "$merged" != true ]; then
            echo "::error::validate passed on $sha but #$pr would not merge" >&2
            exit 1
          fi
        shell: bash

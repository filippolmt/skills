name: validate

on:
  pull_request:
  push:
    branches: [main]
  # Dispatchable so the regeneration job can raise this check on its own PR. That
  # PR is pushed with GITHUB_TOKEN, which triggers no workflow, so the one required
  # check would never arrive and auto-merge would wait forever (ADR-0011). A
  # dispatched run attaches to the branch head — the sha branch protection reads.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Test repo scripts
        # Glob, for the same reason as the hook tests below: a new script test is
        # picked up by adding the file, without a second edit in here.
        run: |
          shopt -s nullglob
          tests=(scripts/*.test.js)
          if [ ${#tests[@]} -eq 0 ]; then echo "no script tests found" >&2; exit 1; fi
          for t in "${tests[@]}"; do echo "--- $t"; node "$t"; done
        shell: bash
      - name: Test local plugin hooks
        # Glob, not one step per plugin: a new hook test is picked up by adding
        # the test file, without a second edit in this file.
        run: |
          shopt -s nullglob
          tests=(plugins/*/hooks/*.test.js)
          if [ ${#tests[@]} -eq 0 ]; then echo "no hook tests found" >&2; exit 1; fi
          for t in "${tests[@]}"; do echo "--- $t"; node "$t"; done
        shell: bash
      - name: Check README catalog is in sync
        run: node scripts/gen-readme.js --check
      - name: Check every catalog path resolves at its pinned sha
        # NOT `--check`: a Renovate PR moves a sha, so the committed tree is out of
        # date by design until regeneration follows, and comparing it here would turn
        # every Renovate PR red — the coupling ADR-0010 rejects. This half is the
        # guard an upstream folder renamed under a pinned entry walks into.
        run: node scripts/gen-skills-tree.js --verify-paths
      - name: Check Renovate regex covers every git-subdir entry
        run: node scripts/check-renovate.js
      - name: Check no local command or skill name is already taken
        run: node scripts/check-name-collisions.js
      - name: Validate marketplace and plugins
        run: claude plugin validate .

name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit plus its first parent, the base it was built on.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.331
      - name: Install zsh
        # rewrites.test.js runs each deny's rewrite under zsh against bash; it
        # fails, not skips, when zsh is absent.
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Test repo scripts and local plugin hooks
        # The globs, their empty guard and their reasoning live in the script, so
        # `regenerate` runs the same suite instead of a copy that drifts from it.
        run: bash scripts/run-tests.sh
      - name: Check README catalog is in sync
        run: node scripts/gen-readme.js --check
      - name: Resolve every catalog path at its pinned sha
        # NOT `--check`: a Renovate PR moves a sha, so the committed tree is out of
        # date by design until regeneration follows, and comparing it here would turn
        # every Renovate PR red — the coupling ADR-0010 rejects. A path gone upstream
        # is named here, not failed: the PR has to merge for regeneration to prune it
        # (ADR-0015). A missing sha or a failed clone still fails.
        run: node scripts/gen-skills-tree.js --verify-paths
      - name: Refuse a pinned sha moved off its history
        # The step above lets a vanished path through for regeneration to prune; a
        # sha behind, diverged or unrelated would prune what upstream never removed
        # (ADR-0041). Only a pull request has a base to compare against: HEAD^1, the
        # base its merge commit was built on. A base fetched now would flag every sha
        # bumped on main since the event as moved behind.
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-sha-history.js HEAD^1
      - name: Check external entry shapes and Renovate regex coverage
        run: node scripts/check-renovate.js
      - name: Check every external repo is classified in ADR-0014
        run: node scripts/check-whole-sources.js --classified
      - name: Check no local command or skill name is already taken
        run: node scripts/check-name-collisions.js
      - name: Validate marketplace and plugins
        run: claude plugin validate --strict .
      - name: Lint GitHub workflows
        # The image bundles shellcheck, so the shell in run: steps is linted too.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

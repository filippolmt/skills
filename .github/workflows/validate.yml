name: validate

on:
  pull_request:
  push:
    branches: [main]
  # Dispatchable so the regeneration job can raise this check on its own PR. That
  # PR is pushed with GITHUB_TOKEN, which triggers no workflow, so the one required
  # check would otherwise never arrive and the PR could never merge (ADR-0011).
  # Note what a dispatched run checks out: the branch head, not the
  # `refs/pull/N/merge` a `pull_request` run gets. Same tree as the commit, one
  # merge short of the base — see ADR-0011 for why that is the acceptable half.
  workflow_dispatch:

permissions:
  contents: read
  # For the last step only. An explicit block sets every omitted scope to `none`,
  # so `contents: read` has to be spelled out for the checkout.
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Test repo scripts and local plugin hooks
        # The globs, their empty guard and their reasoning live in the script, so
        # `regenerate` runs the same suite instead of a copy that drifts from it.
        run: bash scripts/run-tests.sh
      - name: Check README catalog is in sync
        run: node scripts/gen-readme.js --check
      - name: Check every catalog path resolves at its pinned sha
        # NOT `--check`: a Renovate PR moves a sha, so the committed tree is out of
        # date by design until regeneration follows, and comparing it here would turn
        # every Renovate PR red — the coupling ADR-0010 rejects. This half is the
        # guard an upstream folder renamed under a pinned entry walks into.
        run: node scripts/gen-skills-tree.js --verify-paths
      - name: Check Renovate regex covers every git-subdir entry
        run: node scripts/check-renovate.js
      - name: Check no local command or skill name is already taken
        run: node scripts/check-name-collisions.js
      - name: Validate marketplace and plugins
        run: claude plugin validate .
      # Measured on #206: a dispatched run's check suite is NOT associated with the
      # pull request. The check lands on the commit — `validate`, the right app id,
      # green — while the PR's rollup stays empty, so branch protection never counts
      # it and the merge is refused with "the base branch policy prohibits the
      # merge". A commit status it does count. This is not a status the merging job
      # posts about itself: it is this run reporting the suite it just ran, on the
      # sha it ran against (ADR-0011).
      - name: Report the verdict as a commit status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context=validate \
            -f target_url="$RUN_URL" \
            -f description='dispatched run of the suite every pull request passes' >/dev/null
        shell: bash

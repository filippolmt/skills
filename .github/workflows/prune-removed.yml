name: prune-removed

# A Renovate PR moves a `sha`. When upstream deleted or renamed a skill folder at
# that sha, `validate` fails on `gen-skills-tree.js --verify-paths` and the PR stays
# red for good, holding back every other entry from the same repo. This job takes
# that PR's head, drops the entries that no longer resolve
# (`scripts/prune-removed.js`), and proposes the result as a PR of its own.
#
# Its own PR, not a commit on Renovate's branch, and never merged unattended: a
# rename looks exactly like a delete from here, and a removal breaks every existing
# install (`Plugin "<name>" not found` on update — README, *When a skill leaves the
# catalog*). Once a human merges it, the sha is already current and Renovate closes
# its own PR.
#
# Pushed with `REGEN_TOKEN` for the reason `regenerate.yml` gives: a branch pushed
# with GITHUB_TOKEN gets its `validate` run parked awaiting approval (ADR-0011).

on:
  pull_request:
    branches: [main]
    paths:
      - .claude-plugin/marketplace.json

permissions:
  contents: read

concurrency:
  group: prune-removed-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  prune:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.REGEN_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Drop entries whose upstream folder is gone
        id: prune
        run: |
          set -euo pipefail
          gone="$(node scripts/prune-removed.js)"
          if [ -z "$gone" ]; then
            echo "every path resolves; nothing to prune"
            exit 0
          fi
          {
            echo 'gone<<EOF'
            echo "$gone"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          git status --short
        shell: bash
      - name: Open or update the prune PR
        if: steps.prune.outputs.gone != ''
        env:
          GH_TOKEN: ${{ secrets.REGEN_TOKEN }}
          GONE: ${{ steps.prune.outputs.gone }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          branch="chore/prune-removed-$SOURCE_PR"
          list="$(while read -r name; do echo "- \`$name\`"; done <<< "$GONE")"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -am 'fix: drop catalog entries removed upstream'
          git push --force origin "$branch"
          body="$(cat <<EOF
          #$SOURCE_PR moves a sha at which these catalog entries no longer resolve upstream:

          $list

          This PR carries that bump with the entries removed, their names dropped from every bundle's \`dependencies\` (version bumped), and the README regenerated. Merging it makes #$SOURCE_PR redundant; Renovate closes it.

          **Check before merging:** a rename upstream looks exactly like a delete. If a skill moved, fix its \`path\` on #$SOURCE_PR instead and close this. Bundle descriptions that name a removed skill are prose and still need a hand edit.

          **Installed copies break:** \`claude plugin update\` on a removed name fails with \`Plugin "<name>" not found\`. Uninstall each one with \`/plugin uninstall <name>@filippo-skills\` in every scope that has it (README, *When a skill leaves the catalog*).
          EOF
          )"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title 'fix: drop catalog entries removed upstream' --body "$body"
            gh pr comment "$SOURCE_PR" --body "Some entries no longer resolve at this sha, so \`validate\` cannot pass here. \`prune-removed\` proposed the bump with them removed in its own PR, from \`$branch\`."
          else
            gh pr edit "$pr" --body "$body"
          fi
        shell: bash

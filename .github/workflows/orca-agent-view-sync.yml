name: orca-agent-view-sync

# Rebuilds plugins/orca-agent-view from the latest Orca release tag and proposes
# a PR when the mod changed (ADR-0046). Orca tags almost daily and the mod
# rarely changes, so the PR comes only on a real diff. The PR is left for review,
# not auto-merged: it ships third-party code that runs inside Claude Code.
#
# The push uses REGEN_TOKEN, as regenerate.yml does: a branch pushed with
# GITHUB_TOKEN gets its `validate` run parked awaiting approval.

on:
  schedule:
    - cron: '41 5 * * *'
  pull_request:
    paths:
      - scripts/sync-orca-agent-view.js
      - .github/workflows/orca-agent-view-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-agent-view-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.REGEN_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Find the latest Orca release tag
        id: tag
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/stablyai/orca 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out Orca's sources
        run: |
          git clone --quiet --depth 1 --branch '${{ steps.tag.outputs.tag }}' \
            --filter=blob:none --sparse https://github.com/stablyai/orca.git "$RUNNER_TEMP/orca"
          git -C "$RUNNER_TEMP/orca" sparse-checkout set src/main/claude/agent-view src/shared/agent-hook-listener
      - name: Rebuild the plugin
        run: node scripts/sync-orca-agent-view.js "$RUNNER_TEMP/orca"
      # On a pull request the run only proves the script still reads Orca's
      # latest sources; a diff there is reported, not pushed.
      - name: Show the diff
        if: github.event_name == 'pull_request'
        run: git diff --stat
      - name: Propose a PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.REGEN_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "orca-agent-view is current with Orca $TAG"
            exit 0
          fi
          version=$(node -p "require('./plugins/orca-agent-view/.claude-plugin/plugin.json').version")
          branch=sync/orca-agent-view
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "fix(orca-agent-view): sync with Orca $TAG"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr create --base main --head "$branch" \
              --title "fix(orca-agent-view): sync with Orca $TAG" \
              --body "Rebuilt by \`orca-agent-view-sync\` from stablyai/orca \`$TAG\`; plugin version $version. Review the diff of \`hooks/register.js\` before merging: it runs inside Claude Code."
          fi

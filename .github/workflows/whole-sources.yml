name: whole-sources

# A whole source (ADR-0014) has every upstream skill catalogued, but nothing else
# in the pipeline adds one: Renovate moves the `sha`, regeneration prunes what
# upstream deleted, and a skill upstream ADDED waits for a human. This job finds
# those skills and keeps ONE issue open listing them, closing it once they are
# catalogued or excluded (ADR-0024). It opens an issue, not a PR: an entry needs a
# description and sometimes an exclusion decision, which are not a generator's.

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - .claude-plugin/marketplace.json
      - docs/adr/0014-each-source-repo-is-whole-or-curated.md
      - scripts/check-whole-sources.js
      - scripts/catalog.js
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: whole-sources
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Report uncatalogued skills of whole sources
        env:
          # Read by the script for the API and by gh for the issue.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title='Whole sources ship uncatalogued skills'
          # Actions runs bash with -e, so a bare `report="$(...)"` would end the step
          # on exit 1 — the one status this job exists to act on.
          status=0
          report="$(node scripts/check-whole-sources.js)" || status=$?
          echo "$report"
          # 2 is a failure to look (API error, truncated tree): fail loudly, touch no issue.
          # Node also exits 1 when the script cannot even load, so a 1 counts as a
          # finding only when it printed one.
          if [ "$status" -eq 1 ] && [[ "$report" != 'Whole sources ship skills'* ]]; then status=2; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
          # Oldest first: that one is kept, any duplicate is closed in its favour. Search
          # can lag a just-created issue, so two close runs may open two; the next run
          # closes the extra.
          open_issues="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | sort_by(.number) | .[].number")"
          issues=()
          if [ -n "$open_issues" ]; then mapfile -t issues <<<"$open_issues"; fi
          for dup in "${issues[@]:1}"; do
            gh issue close "$dup" --reason 'not planned' --comment "Duplicate of #${issues[0]}." >/dev/null
          done
          issue="${issues[0]:-}"
          if [ "$status" -eq 1 ]; then
            body="$report"$'\n\n'"Found by \`.github/workflows/whole-sources.yml\` at the pinned \`sha\` of each entry (ADR-0024)."
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body" >/dev/null
            else
              gh issue create --title "$title" --body "$body" >/dev/null
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'Every skill of the whole sources is now catalogued or excluded.' >/dev/null
          fi
        shell: bash
